plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.oalarm.alarmengine'
version = '0.1.0'

android {
  namespace "com.oalarm.alarmengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests for the platform-independent engine (store, recurrence, restore, snooze).
  testImplementation 'junit:junit:4.13.2'
  // Real org.json on the JVM (android.jar only ships stubs).
  testImplementation 'org.json:json:20240303'
}
